# Dependency updates: https://github.com/garylesueur/puregaz/blob/main/workflows/dependency-updates.md
# Patch and minor PRs auto-merge after the required checks pass; majors wait for review.
version: 2
updates:
  - package-ecosystem: npm
    directories: ["/"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 5
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]

  - package-ecosystem: github-actions
    directories: ["/"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      actions:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
