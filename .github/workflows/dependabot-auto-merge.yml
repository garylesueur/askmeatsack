# Copy to .github/workflows/dependabot-auto-merge.yml.
# Guide: https://github.com/garylesueur/puregaz/blob/main/workflows/dependency-updates.md
#
# Turns on GitHub auto-merge for Dependabot's patch and minor PRs. GitHub then
# merges only after the default branch's required checks pass, so the repository
# must have a ruleset with required status checks; without one, a PR would merge
# untested. Major updates are left for a person.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
